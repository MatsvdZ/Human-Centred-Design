<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Darice Movie Experience</title>
    <link rel="stylesheet" href="styles/style.css" />
  </head>
  <body>
    <main class="page">
      <h1>Darice Movie Experience</h1>
      <p class="intro">
        Standaardmodus toont rustige ondertiteling. Met de experience-slider
        worden tekst en beeld steeds expressiever.
      </p>

      <div class="player" id="player">
        <video id="video" controls preload="metadata">
          <source src="content/the-office-clips.mp4" type="video/mp4" />
          Je browser ondersteunt deze video niet.
        </video>

        <div id="sideAccentLeft" class="side-accent left"></div>
        <div id="sideAccentTop" class="side-accent top"></div>
        <div id="sideAccentRight" class="side-accent right"></div>
        <div id="sideAccentBottom" class="side-accent bottom"></div>

        <div id="subtitle" class="subtitle"></div>
      </div>

      <section class="controls-panel">
        <div class="top-controls">
          <button id="decreaseFont" type="button">A-</button>
          <button id="increaseFont" type="button">A+</button>
          <button id="fullscreenBtn" type="button">Fullscreen</button>
        </div>

        <div class="experience-row">
          <label for="experienceRange">Weergavemodus</label>
          <input
            type="range"
            id="experienceRange"
            min="0"
            max="3"
            step="1"
            value="0"
          />
          <span id="experienceLabel">Standaard</span>
        </div>

        <div class="status-box">
          <span class="status-pill"
            >Modus: <strong id="modeStatus">Standaard</strong></span
          >
          <span class="status-pill"
            >Tekstgrootte: <strong id="fontSizeStatus">24px</strong></span
          >
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
