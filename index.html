<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles/style.css" />
    <title>Hoor het beeld</title>
  </head>
  <body>
    <main class="page">
      <h1>Movie Experience Player</h1>
      <p>
        Standaard modus toont rustige captions. Met de slider kun je de
        experience-modus versterken voor meer sfeer, emotie en visuele
        geluidsondersteuning.
      </p>

      <div class="player" id="player">
        <video id="video" controls preload="metadata">
          <source src="content/the-office-clips.mp4" type="video/mp4" />
          Je browser ondersteunt deze video niet.
        </video>

        <div id="subtitle" class="subtitle"></div>
      </div>

      <div class="controls-panel">
        <div class="top-controls">
          <button id="decreaseFont" type="button">A-</button>
          <button id="increaseFont" type="button">A+</button>
          <button id="fullscreenBtn" type="button">Fullscreen</button>
        </div>

        <div class="experience-row">
          <label for="experienceRange">Weergavemodus</label>
          <input
            type="range"
            id="experienceRange"
            min="0"
            max="3"
            step="1"
            value="0"
          />
          <span id="experienceLabel">Standaard</span>
        </div>

        <div class="status-box">
          <span class="status-pill"
            >Modus: <strong id="modeStatus">Standaard</strong></span
          >
          <span class="status-pill"
            >Tekstgrootte: <strong id="fontSizeStatus">24px</strong></span
          >
        </div>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
